# Render Blueprint — API + Postgres only (frontend on Vercel)

databases:
  - name: regimens-db
    plan: free
    databaseName: regimens
    user: regimens

services:
  - type: web
    name: regimens-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --prefix backend && npm install --prefix database
    startCommand: node scripts/render-start.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: USE_MOCK_DB
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: regimens-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: DATABASE_SSL
        value: "true"
      # Set in dashboard after Vercel deploy, e.g. https://regimens.vercel.app
      - key: CORS_ORIGIN
        sync: false
